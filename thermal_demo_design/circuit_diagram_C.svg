<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="1100" height="750">
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 18px; font-weight: bold; fill: #1a1a2e; }
      .subtitle { font-size: 11px; fill: #555; }
      .label { font-size: 11px; font-weight: bold; fill: #16213e; }
      .value { font-size: 10px; fill: #0f3460; }
      .note { font-size: 9px; fill: #777; font-style: italic; }
      .pin { font-size: 9px; fill: #6c757d; font-weight: bold; }
      .wire { stroke: #2c3e50; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-red { stroke: #e74c3c; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-blue { stroke: #3498db; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-green { stroke: #27ae60; stroke-width: 2; fill: none; stroke-linecap: round; }
      .wire-orange { stroke: #e67e22; stroke-width: 2; fill: none; stroke-linecap: round; }
      .wire-purple { stroke: #8e44ad; stroke-width: 2; fill: none; stroke-linecap: round; }
      .wire-gray { stroke: #95a5a6; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-dasharray: 4,3; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#27ae60"/>
    </marker>
  </defs>

  <rect width="1100" height="750" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <text x="550" y="28" text-anchor="middle" class="title">構成C: Arduino版「マクスウェルの悪魔」情報エンジン 回路図</text>
  <text x="550" y="44" text-anchor="middle" class="subtitle">体温温度差（ΔT≈5〜15℃）で Feedback ON/OFF の発電効率差を検証</text>

  <!-- ===== SECTION LABELS ===== -->
  <!-- Thermal source -->
  <rect x="15" y="55" width="160" height="310" rx="8" fill="#fff5f5" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="95" y="75" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="bold">🌡️ 熱源 &amp; TEG</text>

  <!-- Boost converter -->
  <rect x="195" y="55" width="210" height="310" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="300" y="75" text-anchor="middle" font-size="12" fill="#1e8449" font-weight="bold">⚡ 昇圧 &amp; 蓄電</text>

  <!-- Arduino Demon -->
  <rect x="425" y="55" width="270" height="310" rx="8" fill="#eff6ff" stroke="#3498db" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="560" y="75" text-anchor="middle" font-size="12" fill="#2471a3" font-weight="bold">🤖 マクスウェルの悪魔 (Arduino)</text>

  <!-- Output -->
  <rect x="715" y="55" width="370" height="310" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="900" y="75" text-anchor="middle" font-size="12" fill="#b45309" font-weight="bold">💡 出力比較 (Feedback OFF vs ON)</text>

  <!-- ===== TEG MODULE ===== -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="130" height="100" rx="6" fill="#ecf0f1" stroke="#2c3e50" stroke-width="2"/>
    <rect x="5" y="5" width="120" height="25" rx="3" fill="#ff6b6b" opacity="0.25"/>
    <text x="65" y="22" text-anchor="middle" font-size="9" fill="#c0392b">🖐️ 体温面 (36℃)</text>
    <rect x="5" y="70" width="120" height="25" rx="3" fill="#74b9ff" opacity="0.25"/>
    <text x="65" y="87" text-anchor="middle" font-size="9" fill="#2980b9">🌬️ 外気面 (20〜28℃)</text>
    <!-- P-N pairs -->
    <g opacity="0.5">
      <rect x="15" y="35" width="8" height="20" fill="#e74c3c" rx="1"/>
      <rect x="26" y="35" width="8" height="20" fill="#3498db" rx="1"/>
      <rect x="42" y="35" width="8" height="20" fill="#e74c3c" rx="1"/>
      <rect x="53" y="35" width="8" height="20" fill="#3498db" rx="1"/>
      <rect x="69" y="35" width="8" height="20" fill="#e74c3c" rx="1"/>
      <rect x="80" y="35" width="8" height="20" fill="#3498db" rx="1"/>
      <rect x="96" y="35" width="8" height="20" fill="#e74c3c" rx="1"/>
      <rect x="107" y="35" width="8" height="20" fill="#3498db" rx="1"/>
    </g>
    <!-- Terminals -->
    <circle cx="35" cy="100" r="4" fill="#e74c3c"/>
    <circle cx="95" cy="100" r="4" fill="#3498db"/>
    <text x="65" y="120" text-anchor="middle" class="label">SP1848-27145</text>
    <text x="65" y="132" text-anchor="middle" class="value">TEGモジュール</text>
  </g>

  <!-- DS18B20 sensors -->
  <g transform="translate(35, 260)">
    <rect x="0" y="0" width="55" height="25" rx="4" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="28" y="16" text-anchor="middle" font-size="8" fill="#16213e" font-weight="bold">DS18B20</text>
    <text x="28" y="38" text-anchor="middle" class="value">高温側</text>
  </g>
  <g transform="translate(100, 260)">
    <rect x="0" y="0" width="55" height="25" rx="4" fill="#fff" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="28" y="16" text-anchor="middle" font-size="8" fill="#16213e" font-weight="bold">DS18B20</text>
    <text x="28" y="38" text-anchor="middle" class="value">低温側</text>
  </g>

  <!-- ===== CJMCU-3108 MODULE ===== -->
  <g transform="translate(210, 90)">
    <rect x="0" y="0" width="180" height="140" rx="8" fill="#1b4332" stroke="#2d6a4f" stroke-width="2"/>
    <text x="90" y="20" text-anchor="middle" font-size="12" fill="#d8f3dc" font-weight="bold">CJMCU-3108</text>
    <text x="90" y="35" text-anchor="middle" font-size="9" fill="#95d5b2">LTC3108 Energy Harvester</text>
    <!-- IC -->
    <rect x="50" y="45" width="80" height="35" rx="3" fill="#081c15" stroke="#40916c" stroke-width="1"/>
    <text x="90" y="66" text-anchor="middle" font-size="8" fill="#b7e4c7">LTC3108</text>
    <!-- Pins left -->
    <rect x="-6" y="50" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="-18" y="57" text-anchor="end" class="pin" fill="#e74c3c">VIN+</text>
    <rect x="-6" y="70" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="-18" y="77" text-anchor="end" class="pin" fill="#3498db">GND</text>
    <!-- Pins right -->
    <rect x="174" y="45" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="198" y="52" text-anchor="start" class="pin" fill="#27ae60">VOUT</text>
    <rect x="174" y="62" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="198" y="69" text-anchor="start" class="pin" fill="#8e44ad">VSTORE</text>
    <rect x="174" y="79" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="198" y="86" text-anchor="start" class="pin" fill="#6c757d">PGD</text>
    <rect x="174" y="96" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="198" y="103" text-anchor="start" class="pin" fill="#3498db">GND</text>
    <!-- Voltage setting -->
    <text x="90" y="105" text-anchor="middle" font-size="8" fill="#95d5b2">VS1=H → 3.3V出力</text>
    <!-- Supercap on VSTORE -->
    <text x="90" y="130" text-anchor="middle" font-size="8" fill="#95d5b2">入力: 20mV〜 で動作開始</text>
  </g>

  <!-- Supercapacitor on VSTORE -->
  <g transform="translate(260, 265)">
    <line x1="5" y1="0" x2="45" y2="0" stroke="#8e44ad" stroke-width="3"/>
    <line x1="5" y1="10" x2="45" y2="10" stroke="#8e44ad" stroke-width="3"/>
    <path d="M 5 10 Q 25 18 45 10" fill="none" stroke="#8e44ad" stroke-width="2"/>
    <text x="50" y="5" font-size="10" fill="#8e44ad" font-weight="bold">+</text>
    <text x="25" y="32" text-anchor="middle" class="label">C_store</text>
    <text x="25" y="44" text-anchor="middle" class="value">0.47F 5.5V</text>
  </g>

  <!-- ===== WIRING: TEG to CJMCU ===== -->
  <path d="M 65 210 L 65 220 L 195 220 L 195 144 L 204 144" class="wire-red"/>
  <path d="M 125 210 L 125 230 L 185 230 L 185 164 L 204 164" class="wire-blue"/>

  <!-- VSTORE to Supercap -->
  <path d="M 396 152 L 420 152 L 420 245 L 305 245 L 305 265" class="wire-purple"/>
  <!-- Supercap GND -->
  <path d="M 285 275 L 250 275 L 250 320 L 550 320 L 550 340" class="wire-blue"/>

  <!-- ===== ARDUINO NANO ===== -->
  <g transform="translate(445, 95)">
    <rect x="0" y="0" width="230" height="250" rx="8" fill="#1a365d" stroke="#2b6cb0" stroke-width="2"/>
    <!-- USB connector -->
    <rect x="85" y="-12" width="60" height="16" rx="3" fill="#718096" stroke="#4a5568" stroke-width="1.5"/>
    <text x="115" y="1" text-anchor="middle" font-size="8" fill="#e2e8f0">USB (5V電源)</text>
    
    <text x="115" y="25" text-anchor="middle" font-size="14" fill="#bee3f8" font-weight="bold">Arduino Nano</text>
    <text x="115" y="40" text-anchor="middle" font-size="9" fill="#90cdf4">「マクスウェルの悪魔」制御</text>

    <!-- Pin labels - Left side -->
    <rect x="-6" y="55" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="15" y="62" font-size="9" fill="#bee3f8" font-weight="bold">D2</text>
    <text x="50" y="62" font-size="8" fill="#90cdf4">← DS18B20 (OneWire)</text>

    <rect x="-6" y="75" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="15" y="82" font-size="9" fill="#bee3f8" font-weight="bold">D3</text>
    <text x="50" y="82" font-size="8" fill="#90cdf4">→ MOSFET Gate (悪魔制御)</text>

    <rect x="-6" y="95" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="15" y="102" font-size="9" fill="#bee3f8" font-weight="bold">D5</text>
    <text x="50" y="102" font-size="8" fill="#90cdf4">→ LED_demon 直接制御</text>

    <rect x="-6" y="120" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="15" y="127" font-size="9" fill="#bee3f8" font-weight="bold">A0</text>
    <text x="50" y="127" font-size="8" fill="#90cdf4">← VSTORE 電圧モニタ</text>

    <rect x="-6" y="140" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="15" y="147" font-size="9" fill="#bee3f8" font-weight="bold">A1</text>
    <text x="50" y="147" font-size="8" fill="#90cdf4">← VOUT 電圧モニタ</text>

    <!-- GND pin -->
    <rect x="-6" y="165" width="12" height="8" rx="1" fill="#ffd54f"/>
    <text x="15" y="172" font-size="9" fill="#bee3f8" font-weight="bold">GND</text>

    <!-- Code snippet -->
    <rect x="10" y="185" width="210" height="55" rx="4" fill="#0d1b2a" stroke="#1b3a5c"/>
    <text x="20" y="200" font-size="8" fill="#63b3ed" font-family="monospace">if (V_cap &gt; THRESHOLD) {</text>
    <text x="20" y="212" font-size="8" fill="#68d391" font-family="monospace">  MOSFET = ON; // 悪魔がゲートを開く</text>
    <text x="20" y="224" font-size="8" fill="#68d391" font-family="monospace">  flash_LED(); // エネルギー抽出!</text>
    <text x="20" y="236" font-size="8" fill="#63b3ed" font-family="monospace">}</text>
  </g>

  <!-- ===== WIRING: Sensors to Arduino ===== -->
  <!-- DS18B20 to D2 -->
  <path d="M 63 285 L 63 310 L 430 310 L 430 153 L 439 153" class="wire-orange"/>
  <path d="M 128 285 L 128 310" class="wire-orange"/>
  <!-- 4.7k pullup label -->
  <text x="250" y="305" text-anchor="middle" font-size="9" fill="#e67e22">4.7kΩ プルアップ</text>

  <!-- VSTORE to A0 (voltage divider) -->
  <path d="M 420 245 L 420 218 L 439 218" class="wire-purple"/>
  <text x="425" y="210" font-size="8" fill="#8e44ad">分圧 10k/10k</text>

  <!-- ===== OUTPUT SECTION ===== -->
  
  <!-- Path A: No Feedback (Passive) -->
  <g transform="translate(730, 90)">
    <rect x="0" y="0" width="160" height="130" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="80" y="18" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="bold">Path A: Feedback OFF</text>
    <text x="80" y="32" text-anchor="middle" font-size="9" fill="#b91c1c">(悪魔なし = 受動的)</text>

    <!-- Resistor -->
    <rect x="20" y="48" width="50" height="18" rx="3" fill="#fff3cd" stroke="#2c3e50" stroke-width="1.5"/>
    <polyline points="20,57 28,48 36,66 44,48 52,66 60,57 70,57" fill="none" stroke="#856404" stroke-width="1.2"/>
    <text x="45" y="80" text-anchor="middle" font-size="9" fill="#16213e">R1: 330Ω</text>

    <!-- LED passive -->
    <polygon points="95,45 135,45 115,75" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="98" y1="75" x2="132" y2="75" stroke="#dc2626" stroke-width="2"/>
    <text x="115" y="92" text-anchor="middle" class="label" fill="#991b1b">LED_passive</text>
    <text x="115" y="105" text-anchor="middle" class="value">赤色 (常時接続)</text>
    <text x="115" y="118" text-anchor="middle" class="note">→ 暗い / 点灯しない</text>
  </g>

  <!-- Path B: With Feedback (Demon) -->
  <g transform="translate(730, 230)">
    <rect x="0" y="0" width="340" height="130" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="170" y="18" text-anchor="middle" font-size="11" fill="#1e3a5f" font-weight="bold">Path B: Feedback ON (悪魔あり)</text>
    <text x="170" y="32" text-anchor="middle" font-size="9" fill="#3b82f6">(Arduino が最適タイミングで制御)</text>

    <!-- MOSFET -->
    <rect x="15" y="45" width="65" height="35" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="48" y="60" text-anchor="middle" font-size="9" fill="#1e40af" font-weight="bold">MOSFET</text>
    <text x="48" y="72" text-anchor="middle" font-size="8" fill="#3b82f6">IRLZ44N</text>
    <!-- Gate label -->
    <text x="48" y="42" text-anchor="middle" font-size="8" fill="#2563eb">G ← D3</text>

    <!-- Resistor -->
    <rect x="105" y="48" width="50" height="18" rx="3" fill="#fff3cd" stroke="#2c3e50" stroke-width="1.5"/>
    <polyline points="105,57 113,48 121,66 129,48 137,57 145,57 155,57" fill="none" stroke="#856404" stroke-width="1.2"/>
    <text x="130" y="80" text-anchor="middle" font-size="9" fill="#16213e">R2: 100Ω</text>

    <!-- LED demon -->
    <polygon points="185,42 225,42 205,72" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="188" y1="72" x2="222" y2="72" stroke="#2563eb" stroke-width="2"/>
    <!-- Light rays (brighter) -->
    <line x1="228" y1="48" x2="245" y2="38" stroke="#fbbf24" stroke-width="2"/>
    <line x1="230" y1="58" x2="248" y2="52" stroke="#fbbf24" stroke-width="2"/>
    <line x1="228" y1="68" x2="245" y2="72" stroke="#fbbf24" stroke-width="1.5"/>
    <polygon points="243,36 248,40 242,40" fill="#fbbf24"/>
    <polygon points="246,50 251,54 245,53" fill="#fbbf24"/>
    <text x="205" y="90" text-anchor="middle" class="label" fill="#1e3a5f">LED_demon</text>
    <text x="205" y="103" text-anchor="middle" class="value">緑色 (悪魔制御)</text>
    <text x="205" y="118" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="bold">→ 明るくパルス点灯!</text>
  </g>

  <!-- VOUT wire to Path A -->
  <path d="M 396 135 L 720 135 L 730 135" class="wire-green"/>
  <path d="M 800 135 L 825 135" class="wire-green"/>

  <!-- VOUT wire to Path B -->
  <path d="M 720 135 L 720 287 L 730 287" class="wire-green"/>

  <!-- MOSFET to R2 to LED_demon -->
  <path d="M 810 287 L 835 287" class="wire-green"/>
  <path d="M 885 287 L 915 287" class="wire-green"/>

  <!-- Arduino D3 to MOSFET Gate -->
  <path d="M 439 173 L 420 173 L 420 340 L 760 340 L 760 315 L 778 275" class="wire-green" stroke-dasharray="5,3"/>
  <text x="590" y="335" text-anchor="middle" font-size="9" fill="#27ae60" font-weight="bold">D3 → Gate制御信号</text>

  <!-- LED GND connections -->
  <path d="M 845 295 L 845 340" class="wire-blue"/>
  <path d="M 935 302 L 935 340" class="wire-blue"/>

  <!-- GND bus -->
  <line x1="250" y1="340" x2="960" y2="340" stroke="#3498db" stroke-width="2"/>
  <!-- GND symbols -->
  <g transform="translate(590, 340)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#3498db" stroke-width="2.5"/>
    <line x1="4" y1="6" x2="20" y2="6" stroke="#3498db" stroke-width="2"/>
    <line x1="8" y1="12" x2="16" y2="12" stroke="#3498db" stroke-width="1.5"/>
    <text x="12" y="24" text-anchor="middle" font-size="10" fill="#3498db" font-weight="bold">GND</text>
  </g>

  <!-- ===== BOTTOM: Energy Balance Display ===== -->
  <g transform="translate(30, 400)">
    <rect x="0" y="0" width="1040" height="330" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="520" y="25" text-anchor="middle" font-size="16" fill="#1e293b" font-weight="bold">📊 エネルギー収支の可視化（シリアルモニター出力）</text>
    <line x1="20" y1="35" x2="1020" y2="35" stroke="#e2e8f0"/>

    <!-- Two comparison panels -->
    <!-- Panel A: No Feedback -->
    <rect x="20" y="50" width="480" height="120" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="260" y="70" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">❌ Feedback OFF（悪魔なし）</text>
    <text x="40" y="92" font-size="11" fill="#374151">TEG発電量: 10mW (ΔT=10℃)</text>
    <text x="40" y="110" font-size="11" fill="#374151">LED_passive: 常時接続 → ほぼ消灯（電圧不足）</text>
    <text x="40" y="128" font-size="11" fill="#374151">悪魔のコスト: 0mW</text>
    <text x="40" y="150" font-size="13" fill="#dc2626" font-weight="bold">有効光出力: ≈ 0 (LEDの閾値電圧に届かない)</text>

    <!-- Panel B: With Feedback -->
    <rect x="540" y="50" width="480" height="120" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="780" y="70" text-anchor="middle" font-size="13" fill="#1e3a5f" font-weight="bold">✅ Feedback ON（悪魔あり）</text>
    <text x="560" y="92" font-size="11" fill="#374151">TEG発電量: 10mW (同じΔT=10℃)</text>
    <text x="560" y="110" font-size="11" fill="#374151">LED_demon: 蓄電→最適タイミングで明るくパルス!</text>
    <text x="560" y="128" font-size="11" fill="#dc2626">悪魔のコスト (Arduino): 150mW ← 抽出仕事より遥かに大きい!</text>
    <text x="560" y="150" font-size="13" fill="#2563eb" font-weight="bold">有効光出力: ≈ 8mW (目に見えるパルス点灯)</text>

    <!-- Key insight -->
    <rect x="20" y="185" width="1000" height="130" rx="8" fill="#fefce8" stroke="#fbbf24" stroke-width="2"/>
    <text x="520" y="210" text-anchor="middle" font-size="14" fill="#92400e" font-weight="bold">🔑 論文の核心メッセージ（この実験で体験できること）</text>

    <text x="40" y="235" font-size="12" fill="#1e293b">1. 悪魔（Arduino）の介入で、同じ温度差からより多くの「有用な仕事」（LED点灯）を抽出できる</text>
    <text x="40" y="258" font-size="12" fill="#dc2626" font-weight="bold">2. しかし、悪魔自身の消費電力 (150mW) ≫ 抽出仕事の改善分 (8mW) → 古典的にはコスト負け</text>
    <text x="40" y="281" font-size="12" fill="#1e293b">   → 論文 第V章: 「古典的ランダウアー限界では、情報処理コストが常に利得を上回る」の実証</text>
    <text x="40" y="304" font-size="12" fill="#2563eb" font-weight="bold">3. 論文の提案: 量子もつれを使えばこのコストが負に反転 → 真の永久機関的動作が可能</text>
  </g>

  <rect x="2" y="2" width="1096" height="746" fill="none" stroke="#cbd5e1" stroke-width="2" rx="8"/>
</svg>
